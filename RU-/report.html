    <section id="report">
        <h2 style="color:rgb(33, 116, 103)">Report a Misconduct</h2>
        <form action="submit_report" method="post">
        <label for="misconduct"><b>Select the type of misconduct:</b></label><br>
        <label>
            <input type="checkbox" name="scam" value="value1"> Scam
        </label><br>
        <label>
            <input type="checkbox" name="damaged goods" value="value2"> Damaged Goods
        </label><br>
        <label>
            <input type="checkbox" name="theft" value="value3"> Theft
        </label><br>
        <label>
            <input type="checkbox" name="phishing" value="value4"> Phishing

                <br>  
            <div>
                <input type="text" placeholder="username of reported user" id="name" name="name" required>
            </div>
            <br>
            <div>
                <textarea placeholder="Describe the misconduct experience..." id="problem" name="problem" required ></textarea>
            </div>
            <br>
            <button type="submit">Submit Report</button>
        </form>
