    <h2 style="color:rgb(33, 116, 103)"> New Listing </h2>
    <br>

    <!-- form to create post -->

    <form>
        <button type="button"> Add Image </button>
        <br>

        <label for="title"> Title </label><br>
        <input type="text" id="title" name="title"><br>
        <br>

        <label for="descr"> Size </label><br>
        <input type="text" id="size" name="size">
        <br>

        <label for="colour"> Colour(s) </label><br>
        <input type="text" id="colour" name="colour">
        <br>

          <!-- creative feature- drop down menus -->

        <label for="condition">Choose a condition</label>
        <br>
        <select name="condition" id="condition">
        <option value="new">New</option>
        <option value="excellent">Excellent</option>
        <option value="good">Good</option>
        <option value="fair">Fair</option>
        </select>
        <br>
        <br>


        <label for="tag">Choose a category</label>
        <br>
        <select name="tag" id="tag">
        <option value="shirt">Shirts</option>
        <option value="shoes">Shoes</option>
        <option value="pants">Pants</option>
        <option value="hoodie">Hoodies</option>
        <option value="caps_beanies">Caps & Beanies</option>
        </select>

        <br>
        <br>

        <button type="post">Post</button>

        <p> Time of Listing: </p>
        

    </form>
